<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Shopping Adda | Contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="navbar-placeholder"></div>
    
    <div class="container" style="max-width: 600px;">
        <h2 style="margin-bottom: 2rem;">Get in Touch</h2>
        <div class="sidebar" style="width: 100%;">
            <input type="text" class="search-bar" placeholder="Your Name">
            <input type="email" class="search-bar" placeholder="Email Address">
            <textarea class="search-bar" placeholder="Your Message" rows="5" style="resize: vertical;"></textarea>
            <button class="btn" style="width: 100%;" onclick="alert('Message Sent!')">Send Message</button>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="script.js"></script>
</body>
</html>
